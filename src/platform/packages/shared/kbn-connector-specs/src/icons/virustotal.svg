<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
  <title>VirusTotal logo</title>
  <defs>
    <linearGradient id="vtGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#394EFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Shield shape with rounded top -->
  <path d="M100 15 C120 15 140 20 155 35 L155 50 L155 120 C155 155 130 175 100 185 C70 175 45 155 45 120 L45 50 L45 35 C60 20 80 15 100 15 Z" 
        fill="url(#vtGradient)" 
        stroke="#FFFFFF" 
        stroke-width="2.5"
        stroke-linejoin="round"/>
  <!-- Checkmark symbol -->
  <path d="M70 100 L90 120 L130 75" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
